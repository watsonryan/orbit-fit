# @file pyproject.toml
# @brief Define the optional, independently locked publication plotting package.
# @author watson
[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "orbitfit-plots"
version = "0.1.0"
description = "Reproducible publication figures from native orbit-fit results"
authors = [{name = "watson"}]
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["numpy==2.5.4", "matplotlib==3.11.2", "SciencePlots==2.2.2"]

[project.scripts]
orbitfit-plot = "orbitfit_plots.cli:main"

[dependency-groups]
dev = ["ruff==0.17.2"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/orbitfit_plots"]
