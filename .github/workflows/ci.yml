name: C++
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: release
            cc: gcc-14
            cxx: g++-14
          - os: ubuntu-24.04
            preset: sanitize
            cc: gcc-14
            cxx: g++-14
          - os: macos-15
            preset: release
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ORBITFIT_JOBS: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: .cache/cpm
          key: deps-${{ runner.os }}-${{ hashFiles('cmake/*.cmake') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++-14 clang-format-18
      - if: runner.os == 'Linux' && matrix.preset == 'release'
        run: find include src apps tests -type f \( -name '*.cpp' -o -name '*.hpp' \) -print0 | xargs -0 clang-format-18 --dry-run --Werror
      - run: ./local_ci.sh "${{ matrix.preset }}"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build and test with MSVC
        shell: pwsh
        run: |
          cmake -S . -B build/msvc -G "Visual Studio 17 2022" -A x64 -DORBITFIT_WARNINGS_AS_ERRORS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build build/msvc --config Release --parallel 3
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --test-dir build/msvc -C Release --output-on-failure
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
